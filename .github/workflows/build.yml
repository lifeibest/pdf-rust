name: Build Installers

# 触发方式：
#   1) 推送 v* 标签（如 v0.1.0）→ 构建并自动创建 Release 草稿
#   2) 手动触发（Actions 页面 "Run workflow"）→ 只构建，产物存为 Artifact
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS
            # 通用二进制：一个 .dmg 同时含 arm64 + x86_64，覆盖 Apple Silicon 与 Intel Mac
            args: --target universal-apple-darwin
            artifacts: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - platform: windows-latest # x64
            label: Windows
            args: ""
            artifacts: src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      # 通用二进制需要同时具备两个架构的 std；PDFium 已是 mac-univ 通用库，无需额外处理
      - name: Add macOS universal targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 按当前 runner 平台下载对应 PDFium 引擎（macOS→dylib，Windows→dll）到 src-tauri/binaries/
      - name: Download PDFium
        run: pnpm pdfium

      - name: Build app
        run: pnpm tauri build ${{ matrix.args }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdfai-${{ matrix.label }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  # 仅当推送标签时，把两个平台的产物汇总成一个 Release 草稿
  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist-artifacts/**/*

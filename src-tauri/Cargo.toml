[package]
name = "pdf-zhizhuan"
version = "0.1.0"
description = "PDF智转 - 基于 Tauri + Rust(PDFium) 的桌面 PDF 工具箱"
authors = ["PDF智转"]
edition = "2024"
rust-version = "1.90"

[lib]
# `_lib` 后缀用于避免 bin 与 lib 同名冲突（详见 https://github.com/rust-lang/cargo/issues/8519）
name = "pdf_zhizhuan_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
once_cell = "1"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "gif",
    "bmp",
    "tiff",
] }

# PDFium 是本项目唯一的 PDF 引擎：合并 / 拆分 / 旋转 / 栅格化 / 图片建页 全部走它，
# 以保证输出行为一致。运行时动态绑定 libpdfium（由 scripts/download-pdfium.mjs 下载）。
# 注意：`pdfium_latest` 必须与 binaries/ 中 libpdfium 的版本对应，升级任一方都要同步另一方。
pdfium-render = { version = "0.9.5", features = [
    "pdfium_latest",
    "image_latest",
    "thread_safe",
] }

[dev-dependencies]
tempfile = "3"

# 体积优化指引详见 https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

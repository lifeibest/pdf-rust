<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP 统一由 src-tauri/tauri.conf.json 的 app.security.csp 注入，此处不再重复声明，
         否则两份策略取交集会把 ipc: / asset: 拦掉 -->
    <title>PDF智转</title>
    <style>
      /* 首屏占位，避免 React 挂载前的白屏闪烁 */
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      body {
        background-color: #f6f7fb;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
      }
      html.dark body {
        background-color: #0b0d14;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
